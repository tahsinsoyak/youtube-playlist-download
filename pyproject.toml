[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "youtube-playlist-download"
version = "0.2.0"
description = "Permission-first CLI and local web UI for archiving authorized YouTube playlists as high-quality MP3 files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tahsin Soyak" }]
keywords = ["youtube", "playlist", "audio", "mp3", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "rich>=13.9,<15",
  "typer>=0.16,<1",
  "yt-dlp[default]>=2026.7.4",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.55,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
youtube-playlist-download = "playlist_audio.cli:app"
playlist-audio = "playlist_audio.cli:app"

[project.urls]
Homepage = "https://github.com/tahsinsoyak/youtube-playlist-download"
Repository = "https://github.com/tahsinsoyak/youtube-playlist-download"
Issues = "https://github.com/tahsinsoyak/youtube-playlist-download/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_audio"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
